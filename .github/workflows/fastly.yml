name: Update Fastly IPs

on:
  schedule:
    - cron: '45 2 * * *'
  workflow_dispatch:

jobs:
  update-ips:
    runs-on: ubuntu-slim
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Fetch and process IP ranges
        run: |
          # Скачиваем официальный список подсетей Fastly
          curl --fail --silent --show-error --location \
            --connect-timeout 15 --max-time 120 \
            --retry 10 --retry-all-errors --retry-delay 5 \
            "https://api.fastly.com/public-ip-list" \
            -o fastly-ip-list.json

          # Разбиваем префиксы по версиям
          jq -r '.addresses[]?' fastly-ip-list.json \
            | sort -Vu > subnets/v4/fastly.lst

          python3 optimize_subnets.py subnets/v4/fastly.lst

          jq -r '.ipv6_addresses[]?' fastly-ip-list.json \
            | sort -Vu > subnets/v6/fastly.lst

          python3 optimize_subnets.py subnets/v6/fastly.lst

          rm fastly-ip-list.json

      - name: Check for changes and commit
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          git add subnets/

          if git diff --staged --quiet; then
            echo "Нет изменений в подсетях. Коммит отменен."
          else
            git commit -m "chore: update Fastly subnets [$(date +'%Y-%m-%d')]"
            git push
            echo "Изменения успешно закоммичены."
          fi
