name: Update Scaleway IPs

on:
  schedule:
    - cron: '35 2 * * *'
  workflow_dispatch:

jobs:
  update-ips:
    runs-on: ubuntu-slim
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Fetch and process IP ranges
        run: |
          # Скачиваем страницу с информацией о сети Scaleway
          curl --fail --silent --show-error "https://www.scaleway.com/en/docs/account/support/scaleway-network-information.md" -o scaleway.md

          # Извлекаем адреса ТОЛЬКО из раздела "## IP ranges used by Scaleway"
          # (от заголовка раздела до следующего заголовка уровня "## ").
          awk '/^## IP ranges used by Scaleway/{f=1; next} f && /^## /{exit} f' scaleway.md \
            | grep -oE '[0-9a-fA-F:.]+/[0-9]+' > ranges.txt

          # Разбиваем по версиям
          grep -v ':' ranges.txt | sort -Vu > subnets/v4/scaleway.lst
          python3 optimize_subnets.py subnets/v4/scaleway.lst

          grep ':' ranges.txt | sort -Vu > subnets/v6/scaleway.lst
          python3 optimize_subnets.py subnets/v6/scaleway.lst

          rm scaleway.md ranges.txt

      - name: Check for changes and commit
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          git add subnets/

          if git diff --staged --quiet; then
            echo "Нет изменений в подсетях. Коммит отменен."
          else
            git commit -m "chore: update Scaleway subnets [$(date +'%Y-%m-%d')]"
            git push
            echo "Изменения успешно закоммичены."
          fi
